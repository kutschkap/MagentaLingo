<title>MagentaLingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: App-Shell. Handy: Kopfzeile mit Stats, Lernpfad, Tab-Leiste unten. Desktop: Navigation links, Pfad mittig, Stats rechts.
   Lektionen laufen im Vollbild, jede Aufgabe im App-Fenster ihres Kapitels. Figur „Tilly“ begleitet und erklärt. */
:root{
  --bg:#F5F2FC; --surface:#FFFFFF; --surface-2:#FAF8FF; --ink:#1A1430; --muted:#6A6386; --line:#E8E2F4; --line-dk:#D2C9E6;
  --magenta:#E20074; --magenta-dk:#AE0059; --magenta-soft:#FFE4F2;
  --violet:#6D4DFF; --violet-soft:#ECE8FF; --sky:#18B4E8;
  --sun:#FFB400; --sun-dk:#C88800; --sun-soft:#FFF3D1; --fire:#FF6A13;
  --gold:#E2A21B; --gold-dk:#A8750A; --gold-soft:#FFF1D2;
  --silver:#93A0B4; --silver-dk:#677488; --silver-soft:#EEF1F6;
  --ok:#14A35A; --ok-dk:#0C7A42; --ok-soft:#DAF7E7;
  --bad:#E5383B; --bad-dk:#AC1F22; --bad-soft:#FFE3E3;
  --on-ch:#FFFFFF; --mo-ink:#2A1033;
  --hero:linear-gradient(135deg,#E20074 0%,#C2189C 48%,#6D4DFF 100%);
  --shadow:0 14px 34px -16px rgba(58,22,96,.30);
  --c-teams:#5B5FC7; --c-teams-soft:#ECEDFC;
  --c-exo:#0F6CBD; --c-exo-soft:#E2F0FC;
  --c-spo:#03787C; --c-spo-soft:#DCF4F4;
  --c-copilot:#7A45D6; --c-copilot-soft:#F1E9FD;
  --c-sec:#23804E; --c-sec-soft:#E0F4E8;
  --c-lic:#C25400; --c-lic-soft:#FFEDDB;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110C1B; --surface:#1C1629; --surface-2:#221B31; --ink:#F5F1FF; --muted:#A79EC2; --line:#2E2643; --line-dk:#43395E;
  --magenta:#FF3FA4; --magenta-dk:#A6125F; --magenta-soft:#3B1430;
  --violet:#8F78FF; --violet-soft:#26204A; --sky:#4CC8F0;
  --sun:#FFC433; --sun-dk:#A87700; --sun-soft:#3A2D0B; --fire:#FF8A3D;
  --gold:#F0B53A; --gold-dk:#8E6610; --gold-soft:#3A2B0D;
  --silver:#AEB9C9; --silver-dk:#5C6779; --silver-soft:#262B35;
  --ok:#34C477; --ok-dk:#1B7A47; --ok-soft:#123222;
  --bad:#FF5C60; --bad-dk:#A3242B; --bad-soft:#3D1618;
  --on-ch:#120D1C; --mo-ink:#2A1033;
  --shadow:0 14px 34px -16px rgba(0,0,0,.6);
  --c-teams:#9EA1F2; --c-teams-soft:#24254A;
  --c-exo:#62B0F4; --c-exo-soft:#122B45;
  --c-spo:#4ACBCD; --c-spo-soft:#0E3032;
  --c-copilot:#B597F5; --c-copilot-soft:#2A1C43;
  --c-sec:#68CF97; --c-sec-soft:#132C1F;
  --c-lic:#F6A65A; --c-lic-soft:#36230F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110C1B; --surface:#1C1629; --surface-2:#221B31; --ink:#F5F1FF; --muted:#A79EC2; --line:#2E2643; --line-dk:#43395E;
  --magenta:#FF3FA4; --magenta-dk:#A6125F; --magenta-soft:#3B1430;
  --violet:#8F78FF; --violet-soft:#26204A; --sky:#4CC8F0;
  --sun:#FFC433; --sun-dk:#A87700; --sun-soft:#3A2D0B; --fire:#FF8A3D;
  --gold:#F0B53A; --gold-dk:#8E6610; --gold-soft:#3A2B0D;
  --silver:#AEB9C9; --silver-dk:#5C6779; --silver-soft:#262B35;
  --ok:#34C477; --ok-dk:#1B7A47; --ok-soft:#123222;
  --bad:#FF5C60; --bad-dk:#A3242B; --bad-soft:#3D1618;
  --on-ch:#120D1C; --mo-ink:#2A1033;
  --shadow:0 14px 34px -16px rgba(0,0,0,.6);
  --c-teams:#9EA1F2; --c-teams-soft:#24254A;
  --c-exo:#62B0F4; --c-exo-soft:#122B45;
  --c-spo:#4ACBCD; --c-spo-soft:#0E3032;
  --c-copilot:#B597F5; --c-copilot-soft:#2A1C43;
  --c-sec:#68CF97; --c-sec-soft:#132C1F;
  --c-lic:#F6A65A; --c-lic-soft:#36230F;
  color-scheme:dark}
.ch-teams{--ch:var(--c-teams);--ch-soft:var(--c-teams-soft)}
.ch-exo{--ch:var(--c-exo);--ch-soft:var(--c-exo-soft)}
.ch-spo{--ch:var(--c-spo);--ch-soft:var(--c-spo-soft)}
.ch-copilot{--ch:var(--c-copilot);--ch-soft:var(--c-copilot-soft)}
.ch-sec{--ch:var(--c-sec);--ch-soft:var(--c-sec-soft)}
.ch-lic{--ch:var(--c-lic);--ch-soft:var(--c-lic-soft)}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.ico{width:20px;height:20px;flex:none}
#app{position:relative;min-height:100%}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(38vmax 34vmax at -6% -4%,color-mix(in srgb,var(--blob1,var(--magenta)) 16%,transparent),transparent 62%),
             radial-gradient(36vmax 30vmax at 106% 8%,color-mix(in srgb,var(--violet) 15%,transparent),transparent 62%),
             radial-gradient(46vmax 32vmax at 50% 112%,color-mix(in srgb,var(--sky) 12%,transparent),transparent 62%)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px 22px;border:0;border-radius:18px;
  background:var(--magenta);color:#fff;font:800 17px var(--body);letter-spacing:.01em;cursor:pointer;width:100%;
  box-shadow:0 5px 0 var(--magenta-dk);transition:transform .1s,box-shadow .1s,filter .15s}
.btn:hover:not([disabled]){filter:brightness(1.06)}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--magenta-dk)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:0 5px 0 var(--line-dk);cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line-dk),inset 0 0 0 2px var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line-dk),inset 0 0 0 2px var(--line)}
.btn.white{background:#fff;color:#C0006A;box-shadow:0 5px 0 rgba(40,0,40,.25)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-dk)}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-dk)}
.btn.small{min-height:44px;font-size:15px;width:auto;padding:8px 16px;border-radius:14px}
.btn .ico{width:22px;height:22px}
.linkbtn{background:none;border:0;color:var(--muted);font:700 14px var(--body);cursor:pointer;padding:8px;text-decoration:underline;text-underline-offset:3px}

/* Maskottchen */
.mo{display:block;flex:none;overflow:visible}
.mo.float{animation:float 3.2s ease-in-out infinite}
.mo .arm-w{transform-origin:90px 110px;animation:wave 1.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}



/* Tilly blinzelt */
.mo .t-eye.l{transform-origin:46.5px 55px;animation:tBlink 4.6s infinite}
.mo .t-eye.r{transform-origin:73.5px 55px;animation:tBlink 4.6s infinite}
.mo:nth-of-type(2n) .t-eye{animation-duration:5.3s}
@keyframes tBlink{0%,93%,100%{transform:none}95.5%{transform:scaleY(.1)}}
/* Tilly reagiert auf die Maus */
.mo{cursor:pointer}
.mo .t-hand,.mo .t-hi{opacity:0}
.mo.t-glasses .t-hand{animation:tHand 1.1s ease-in-out}
.mo.t-glasses .t-gl{animation:tGl 1.1s ease-in-out}
.mo.t-glasses .arm-r{animation:tArmAway 1.1s ease-in-out}
@keyframes tArmAway{0%{opacity:1;transform:none}16%,78%{opacity:0;transform:translateY(34px)}100%{opacity:1;transform:none}}
@keyframes tHand{0%,10%{opacity:0;transform:translateY(40px)}30%,68%{opacity:1;transform:none}86%,100%{opacity:0;transform:translateY(40px)}}
@keyframes tGl{0%,22%{transform:none}38%{transform:translateY(-4px)}52%{transform:translateY(-1px)}64%,100%{transform:none}}
.mo.t-wink .t-eye.r{transform-origin:74px 55px;animation:tWink .9s ease-in-out}

@keyframes tWink{0%,100%{transform:none}30%,62%{transform:scaleY(.12)}}
@keyframes tBrow{0%,100%{transform:none}30%,62%{transform:translateY(-3px)}}
.mo.t-tilt .t-head{transform-origin:60px 96px;animation:tTilt 1.1s ease-in-out}
@keyframes tTilt{0%,100%{transform:none}30%,70%{transform:rotate(-9deg)}}
.mo.t-jump .t-all{animation:tJump .8s ease-out}
@keyframes tJump{0%,100%{transform:none}30%{transform:translateY(-14px)}55%{transform:none}72%{transform:translateY(-5px)}}
.mo.t-hello .t-hi{transform-origin:100px 124px;animation:tHi 1.1s ease-in-out}
@keyframes tHi{0%{opacity:0;transform:translateY(30px)}20%{opacity:1;transform:none}40%{transform:rotate(14deg)}60%{transform:rotate(-4deg)}80%{opacity:1;transform:rotate(10deg)}100%{opacity:0;transform:translateY(30px)}}
.t-say{position:fixed;z-index:60;padding:6px 12px;border-radius:14px;background:var(--surface);color:var(--ink);font:700 13px var(--body);box-shadow:var(--shadow),0 2px 0 var(--line);pointer-events:none;white-space:nowrap;animation:tSay 1.5s forwards}
.t-say.long{white-space:normal;max-width:min(280px,calc(100vw - 16px));line-height:1.4;padding:9px 13px}
.hsay.muted,.cheer.muted,.cheer2.muted{opacity:0!important;transform:scale(.6) translateY(8px)!important;transition:opacity .2s,transform .2s}
.cheer,.cheer2{transition:opacity .25s,transform .25s}
@keyframes tSay{0%{opacity:0;transform:translateY(6px)}8%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}
/* Medaillen */
.medal{--c:var(--silver);--d:var(--silver-dk);width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6),transparent 40%),var(--c);box-shadow:inset 0 -5px 0 var(--d)}
.medal svg{width:46%;height:46%}
.medal.gold{--c:var(--gold);--d:var(--gold-dk)}
.medal.magenta{--c:var(--magenta);--d:var(--magenta-dk)}
.medal.none{--c:var(--line);--d:var(--line-dk);color:var(--muted)}

/* Willkommen */
.welcome{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-block:28px 48px;display:grid;gap:28px;align-items:center}
@media(min-width:880px){.welcome{grid-template-columns:1.05fr .95fr;min-height:100%;padding-block:48px}}
.brand{display:flex;align-items:center;gap:10px;font:800 19px var(--display);letter-spacing:-.01em}
.brandbtn{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);text-align:left}
.logo{position:relative;width:38px;height:38px;border-radius:12px;background:var(--magenta);display:grid;place-items:center;color:#fff;box-shadow:0 4px 0 var(--magenta-dk);flex:none;overflow:hidden}
.logo b{font:800 24px/1 var(--display);letter-spacing:0;margin-top:-1px}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.logo.has-img img{opacity:1}.logo.has-img b{visibility:hidden}
.namebox{display:flex;justify-content:center;padding-top:4px}
.namebox .linkbtn{font-size:13px}
.nameform{width:100%;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:20px;background:var(--surface);box-shadow:0 2px 0 var(--line)}
.nameform label{font:800 14px var(--body)}
.nameform .wrow input{height:46px;border-radius:14px;font-size:16px}
.logo svg{width:22px;height:22px}
.wtext{display:flex;flex-direction:column;gap:20px}
.kicker{display:inline-flex;align-items:center;gap:8px;width:max-content;padding:6px 12px;border-radius:99px;background:var(--magenta-soft);color:var(--magenta);font:800 13px var(--body);letter-spacing:.04em;text-transform:uppercase}
.welcome h1{font-size:clamp(38px,8.5vw,64px)}
.welcome h1 em{font-style:normal;background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px;color:var(--muted);max-width:46ch}
.tierrow{display:flex;gap:10px;flex-wrap:wrap}
.tierpill{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:14px}
.tierpill .medal{width:30px;height:30px;box-shadow:inset 0 -3px 0 var(--d)}
.tierpill small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.2}
.wcta{display:flex;flex-direction:column;gap:10px;max-width:420px}
.wcta small{color:var(--muted);text-align:center;font-size:13px}
.stage{position:relative;aspect-ratio:1/1;max-width:min(460px,100%);margin:0 auto;width:100%}
.stage .disc{position:absolute;inset:8%;border-radius:50%;background:var(--hero);box-shadow:0 30px 60px -30px rgba(120,0,90,.6)}
.stage .disc::after{content:"";position:absolute;inset:14%;border-radius:50%;border:2px dashed rgba(255,255,255,.35)}
.stage>.mo{position:absolute;left:24%;top:24%;width:52%;height:52%}
.orb{position:absolute;width:19%;aspect-ratio:1;border-radius:28%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ch);animation:float 3.6s ease-in-out infinite}
.orb svg{width:50%;height:50%}
.orb:nth-child(odd){animation-delay:-1.2s}

/* App-Shell */
.shell{position:relative;z-index:1;min-height:100%}
.side,.aside{display:none}
.center{max-width:660px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mtop .in{display:flex;align-items:center;justify-content:space-between;gap:10px;height:62px}
.chips{display:flex;gap:8px}
.schip{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;background:var(--surface);font:800 15px var(--display);font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line)}
.schip.fire{color:var(--fire)}.schip.xp{color:var(--sun-dk)}.schip.goal{color:var(--violet)}
:root[data-theme="dark"] .schip.xp{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .schip.xp{color:var(--sun)}}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border:0;border-radius:16px;background:transparent;color:var(--muted);font:700 12px var(--body);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--magenta);background:var(--magenta-soft)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--magenta);color:#fff;font:800 11px/20px var(--body);text-align:center}
@media(min-width:1040px){
  .shell{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:36px;max-width:1320px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  .center{width:100%;padding-bottom:60px}
  .center .gut{padding-left:0;padding-right:0}
  .mtop,.bnav{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding-block:28px}
  .side .brand{margin-bottom:22px;padding-left:6px}
  .navi{display:flex;align-items:center;gap:14px;padding:12px 14px;border:0;border-radius:16px;background:transparent;color:var(--muted);font:800 16px var(--body);cursor:pointer;text-align:left;position:relative}
  .navi svg{width:26px;height:26px}
  .navi:hover{background:var(--surface)}
  .navi.on{background:var(--magenta-soft);color:var(--magenta);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--magenta) 30%,transparent)}
  .navi .badge{position:static;margin-left:auto}

  .aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:0;align-self:start;padding-block:28px}
  .view{padding-top:28px}
}
.view{display:flex;flex-direction:column;gap:22px;padding-top:6px}

/* Karten rechts / Stats */
.card{background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:18px}
.statrow{display:flex;align-items:center;gap:14px}
.statrow .big{font:800 30px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.statrow small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.flamebox{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--fire) 16%,transparent);color:var(--fire);flex:none}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.week span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.week i{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff}

.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 15px var(--display);color:var(--violet);
  background:radial-gradient(closest-side,var(--surface) 74%,transparent 76%),conic-gradient(var(--violet) calc(var(--p)*1%),var(--violet-soft) 0)}
.ring.sm{width:20px;height:20px;background:radial-gradient(closest-side,var(--surface) 55%,transparent 60%),conic-gradient(var(--violet) calc(var(--p)*1%),var(--violet-soft) 0)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:30px;background:var(--hero);color:#fff;padding:22px;display:flex;gap:10px;align-items:center;box-shadow:0 22px 40px -22px rgba(150,0,100,.7)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.11)}
.hero::before{width:240px;height:240px;right:-70px;top:-90px}
.hero::after{width:140px;height:140px;left:-40px;bottom:-70px}
.hero .ht{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.hero .over{font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.88}
.hero h1{font-size:clamp(25px,6vw,34px)}
.hero .hmeta{display:flex;gap:8px;flex-wrap:wrap}
.hero .hmeta span{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);font:700 13px var(--body)}
.hero .btn{margin-top:6px;max-width:300px}
.hero>.mo,.hmo .mo{position:relative;z-index:1;width:clamp(96px,26vw,150px);height:auto}
.hmo{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.hsay{position:relative;max-width:170px;min-height:2.6em;display:grid;place-items:center;padding:7px 11px;border-radius:14px;background:#fff;color:#B0005F;font:800 12px/1.3 var(--body);text-align:center;box-shadow:0 6px 16px -8px rgba(60,0,40,.5);transition:opacity .35s,transform .35s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 100%}
.hsay.gone{opacity:0;transform:scale(.6) translateY(8px)}
.hsay::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.cheer{position:absolute;left:50%;top:4%;transform:translateX(-50%);z-index:3;max-width:min(300px,86%);padding:10px 16px;border-radius:18px;background:var(--surface);color:var(--ink);font:800 15px/1.35 var(--body);text-align:center;box-shadow:var(--shadow),0 3px 0 var(--line)}
.cheer::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:var(--surface);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.cheer span{display:block;transition:opacity .25s,transform .25s}
.cheer span,.cheer2 span{display:block;transition:opacity .25s,transform .25s}
.cheer span.out,.cheer2 span.out{opacity:0;transform:translateY(4px)}
.mcheer{display:none}
@media(max-width:879px){

  .cheer2{position:relative;flex:1;min-width:0;padding:11px 14px;border-radius:18px;background:var(--surface);font:800 15px/1.35 var(--body);box-shadow:var(--shadow),0 3px 0 var(--line)}
  .cheer2::before{content:"";position:absolute;left:-6px;top:50%;width:14px;height:14px;background:var(--surface);transform:translateY(-50%) rotate(45deg);border-radius:3px}

}
@media(max-width:420px){.hsay{max-width:110px;font-size:11px}}

/* Fehler-Teaser */
.teaser{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);border:0;cursor:pointer;text-align:left;width:100%}

/* Pfad */
.unit{position:relative;display:flex;flex-direction:column}
.unithead{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:18px 20px;border-radius:26px;color:var(--on-ch);
  background:linear-gradient(125deg,var(--ch),color-mix(in srgb,var(--ch) 62%,var(--magenta)));box-shadow:0 6px 0 color-mix(in srgb,var(--ch) 60%,#000)}
.unithead .art{position:absolute;right:-14px;top:-18px;width:112px;height:112px;color:var(--on-ch);opacity:.13;pointer-events:none}

.uico{width:48px;height:48px;border-radius:16px;background:color-mix(in srgb,var(--on-ch) 20%,transparent);display:grid;place-items:center;flex:none}
.uico svg{width:26px;height:26px}
.unithead .row div{flex:1;min-width:0}
.unithead .num{font:800 12px var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.88}
.unithead h3{font-size:22px}
.unithead p{font-size:14px;opacity:.92;position:relative}
.uprog{position:relative;display:flex;align-items:center;gap:10px;font:800 13px var(--body);font-variant-numeric:tabular-nums}
.uprog i{flex:1;height:10px;border-radius:99px;background:color-mix(in srgb,var(--on-ch) 25%,transparent);overflow:hidden}
.uprog i b{display:block;height:100%;border-radius:99px;background:var(--on-ch)}
.unit.locked .unithead{background:var(--line);color:var(--muted);box-shadow:0 6px 0 var(--line-dk)}
.unit.locked .unithead .art{color:var(--muted)}
.lockmsg{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);text-align:center;padding:14px 8px 0}
.lockmsg svg{width:16px;height:16px;flex:none}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:40px 0 12px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.nbtn{--c:var(--silver);--d:var(--silver-dk);position:relative;width:80px;height:74px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:radial-gradient(ellipse at 34% 24%,rgba(255,255,255,.55),transparent 42%),var(--c);
  box-shadow:0 8px 0 var(--d),inset 0 -6px 0 rgba(0,0,0,.08);transition:transform .1s,box-shadow .1s}
.nbtn svg{width:32px;height:32px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.nbtn:hover:not([disabled]){transform:translateY(-2px)}
.nbtn:active:not([disabled]){transform:translateY(6px);box-shadow:0 2px 0 var(--d)}
.nbtn.gold{--c:var(--gold);--d:var(--gold-dk)}
.nbtn.magenta{--c:var(--magenta);--d:var(--magenta-dk)}
.nbtn.test{--c:var(--ch);--d:color-mix(in srgb,var(--ch) 60%,#000);color:var(--on-ch);width:104px;height:92px;border-radius:32px}
.nbtn.test svg{width:44px;height:44px}
.nbtn.locked{--c:var(--line);--d:var(--line-dk);color:var(--muted);cursor:default;background:var(--line)}
.nbtn.locked svg{filter:none}
.node.current .nbtn::after{content:"";position:absolute;inset:-11px;border-radius:inherit;border:4px solid var(--c);opacity:.4;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{inset:-16px;opacity:.12}}
.nlabel{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:200px;padding:5px 12px;border-radius:14px;background:var(--surface);box-shadow:0 2px 0 var(--line);font-size:13px;font-weight:600;line-height:1.3}
.nlabel b{font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--tc,var(--muted))}
.node.lockedn .nlabel{background:transparent;box-shadow:none;color:var(--muted)}
.bubble{position:absolute;top:-48px;padding:7px 14px;border-radius:14px;background:var(--surface);color:var(--magenta);font:800 14px var(--body);white-space:nowrap;box-shadow:var(--shadow),0 2px 0 var(--line);animation:bob 1.6s ease-in-out infinite;z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--surface);transform:translateX(-50%) rotate(45deg);border-radius:2px}
@keyframes bob{50%{transform:translateY(-5px)}}
.buddy{position:absolute;top:-6px;width:76px}
.buddy .mo{width:76px;height:auto}
.reset{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}

/* Fehlertraining & Erfolge */
.vhead{display:flex;align-items:center;gap:16px}
.vhead>.mo{width:84px;height:auto}
.vhead h1{font-size:clamp(28px,6vw,38px)}
.vhead p{color:var(--muted);margin-top:4px}
.vhead div{flex:1;min-width:0}
.bigcount{display:flex;align-items:center;gap:18px;padding:20px;border-radius:26px;background:var(--hero);color:#fff;box-shadow:0 22px 40px -22px rgba(150,0,100,.7)}
.bigcount .n{font:800 60px var(--display);line-height:1;font-variant-numeric:tabular-nums}
.bigcount div{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.bigcount .btn{max-width:260px}
.cchips{display:flex;flex-wrap:wrap;gap:8px}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--ch-soft);color:var(--ch);font:800 13px var(--body)}

.mlist{display:flex;flex-direction:column;gap:10px}

.mitem .dot{width:36px;height:36px;border-radius:12px;background:var(--ch-soft);color:var(--ch);display:grid;place-items:center;flex:none}

.mitem div{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.35}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:30px 20px}

@media(min-width:560px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.sbox{padding:16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.sbox .ico{width:26px;height:26px}
.sbox b{font:800 28px var(--display);font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.sbox small{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.medalrows{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surface);box-shadow:0 2px 0 var(--line)}
.mrow .uico{width:40px;height:40px;border-radius:13px;background:var(--ch-soft);color:var(--ch)}
.mrow .uico svg{width:22px;height:22px}
.mrow .nm{flex:1;min-width:0;font:800 15px var(--display)}
.mrow .slots{display:flex;gap:6px}
.mrow .medal{width:34px;height:34px;box-shadow:inset 0 -3px 0 var(--d)}
.mrow .medal.off{--c:var(--line);--d:var(--line-dk);background:var(--line)}
.mrow .tro{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--line);color:var(--line-dk)}
.mrow .tro.on{background:var(--ch);color:var(--on-ch)}
.mrow .tro .ico{width:20px;height:20px}
@media(max-width:420px){.mrow .nm{font-size:13px}.mrow .medal,.mrow .tro{width:28px;height:28px}.mrow{gap:8px;padding:10px}}

/* Lektion */
.lesson{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.lesson .blobs{--blob1:var(--ch,var(--magenta))}
.bgart{position:fixed;right:-60px;bottom:110px;width:360px;height:360px;color:var(--ch,var(--line));opacity:.07;pointer-events:none;z-index:0}
.bgart.two{right:auto;left:-90px;bottom:auto;top:110px;width:240px;height:240px;transform:scaleX(-1)}
.lw{max-width:700px;margin:0 auto;width:100%;position:relative;z-index:1}
.lhead{display:flex;align-items:center;gap:10px;padding-block:18px 8px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 2px 0 var(--line)}
.iconbtn svg{width:20px;height:20px}
.bar{flex:1;height:18px;border-radius:99px;background:color-mix(in srgb,var(--line) 85%,transparent);overflow:hidden}
.bar i{position:relative;display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--magenta),var(--violet));transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.4)}
.lesson.test .bar i{background:linear-gradient(90deg,var(--ch),color-mix(in srgb,var(--ch) 55%,var(--magenta)))}
.pillstat{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;background:var(--surface);font:800 15px var(--display);font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.pillstat.heart{color:var(--bad)}
.pillstat.combo{color:var(--fire);animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.5);opacity:0}}
.lmain{flex:1;padding-block:8px 28px;display:flex;flex-direction:column;gap:12px}
.ltag{display:flex;align-items:center;gap:8px;font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ch,var(--muted))}
.ltag i{width:8px;height:8px;border-radius:50%;background:currentColor}

/* App-Fenster */
.frame{border-radius:24px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.fr-top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(100deg,var(--ch),color-mix(in srgb,var(--ch) 70%,var(--magenta)));color:var(--on-ch);font:700 13px var(--body);min-width:0}
.fr-top svg{width:18px;height:18px;flex:none}
.fr-top .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-top .tab2{padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--on-ch) 22%,transparent);font-size:12px;white-space:nowrap}
.fr-wrap{display:flex;min-width:0}
.fr-rail{width:48px;flex:none;background:var(--ch-soft);display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;color:var(--ch)}
.fr-rail span{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;opacity:.6}
.fr-rail span.on{background:var(--surface);opacity:1;box-shadow:0 2px 0 var(--line)}
.fr-rail svg{width:18px;height:18px}
.fr-body{flex:1;min-width:0;padding:18px;display:flex;flex-direction:column;gap:16px}
.ptext{font:700 clamp(19px,4.8vw,23px)/1.3 var(--display);color:var(--ink);letter-spacing:-.01em;text-wrap:pretty}
.instr{font-size:13px;color:var(--muted);font-weight:700}
.meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta b{color:var(--ink)}
.msg{display:flex;gap:10px;min-width:0}
.ava{width:38px;height:38px;border-radius:50%;background:var(--magenta-soft);display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.ava .mo{width:100%;height:100%}
.ava::after{content:"";position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.msgcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mtext{background:var(--ch-soft);border-radius:4px 18px 18px 18px;padding:12px 15px;display:flex;flex-direction:column;gap:6px}
.mailtools{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ch)}
.mailtools span{padding:4px 10px;border-radius:9px;background:var(--ch-soft)}
.mailhead{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding-bottom:12px;border-bottom:2px solid var(--line)}
.mailhead .lines{display:flex;flex-direction:column;font-size:13px;min-width:0}
.mailhead .lines b{font:700 16px var(--display)}
.crumb{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumb b{color:var(--ch)}
.filecard{display:flex;gap:12px;align-items:flex-start;min-width:0}
.docic{width:42px;height:50px;border-radius:7px 16px 7px 7px;background:var(--ch);color:var(--on-ch);display:grid;place-items:center;flex:none;font:800 11px var(--display);box-shadow:0 3px 0 color-mix(in srgb,var(--ch) 60%,#000)}
.filecard .fc{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.folders{display:flex;gap:8px;overflow:hidden}
.folders span{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line);font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.folders svg{width:14px;height:14px;color:var(--ch)}
.cp-card{border-radius:18px;padding:14px;border:2px solid transparent;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,var(--ch),var(--magenta),var(--sky)) border-box}
.cp-card .meta svg{width:16px;height:16px;color:var(--ch)}
.cp-input{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--muted);font-size:14px}
.cp-input svg{width:18px;height:18px;color:var(--ch)}
.cp-hello{font:800 16px var(--display);background:linear-gradient(90deg,var(--ch),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-head{display:flex;align-items:center;gap:12px}
.sring{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 13px var(--display);color:var(--ch);
  background:radial-gradient(closest-side,var(--surface) 72%,transparent 74%),conic-gradient(var(--ch) var(--p,70%),var(--line) 0)}
.sec-head .lines{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.sec-head .lines b{display:block;font:700 14px var(--display);color:var(--ink)}
.sev{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--ch-soft);color:var(--ch);font:800 12px var(--body);width:max-content;max-width:100%}
.sev svg{width:14px;height:14px}
.lictable{display:flex;flex-direction:column;gap:7px;padding:11px 13px;border-radius:14px;background:var(--ch-soft)}
.licrow{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.licrow span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.licrow i{display:block;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.licrow i b{display:block;height:100%;background:var(--ch);border-radius:99px}
.fr-label{font:800 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Antworten */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:0;border-radius:16px;background:var(--surface);
  box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line-dk);font:600 16px/1.35 var(--body);color:var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.opt:hover:not([disabled]){box-shadow:inset 0 0 0 2px var(--line-dk),0 4px 0 var(--line-dk)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--line-dk)}
.opt .k{width:30px;height:30px;border-radius:10px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font:800 13px var(--display);color:var(--muted);flex:none}
.opt.sel{background:var(--magenta-soft);box-shadow:inset 0 0 0 2px var(--magenta),0 4px 0 var(--magenta);animation:sel .2s ease-out}
.opt.sel .k{background:var(--magenta);color:#fff;box-shadow:none}
@keyframes sel{50%{transform:scale(1.015)}}
.opt.right{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok),0 4px 0 var(--ok)}
.opt.right .k{background:var(--ok);color:#fff;box-shadow:none}
.opt.wrong{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad),0 4px 0 var(--bad);animation:shake .3s}
.opt[disabled]{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .opt{justify-content:center;font:800 18px var(--display);padding:20px 10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{min-height:62px;padding:8px 10px;border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line-dk);
  font:600 14px/1.3 var(--body);color:var(--ink);cursor:pointer;text-align:center;overflow-wrap:anywhere;transition:transform .08s}
.tile:active:not([disabled]){transform:translateY(3px)}
.tile.sel{background:var(--magenta-soft);box-shadow:inset 0 0 0 2px var(--magenta),0 4px 0 var(--magenta)}
.tile.done{background:var(--ok-soft);box-shadow:none;color:var(--ok);opacity:.6;cursor:default}
.tile.flash{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad),0 4px 0 var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sentence{font-size:19px;font-weight:600;line-height:2.5;padding:2px}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:40px;margin:0 3px;padding:2px 12px;vertical-align:middle;
  border:0;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 -3px 0 var(--line-dk);font:700 16px var(--body);color:var(--magenta);cursor:pointer;line-height:1.2}
.slot.filled{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line-dk);color:var(--ink)}
.slot.r{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}.slot.w{box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chipbtn{padding:11px 15px;border:0;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line-dk);font:700 15px var(--body);color:var(--ink);cursor:pointer;transition:transform .08s}
.chipbtn:active:not([disabled]){transform:translateY(3px)}
.chipbtn.used{color:transparent;background:var(--line);box-shadow:none;cursor:default}
.olist{display:flex;flex-direction:column;gap:8px;min-height:64px;padding:10px;border-radius:18px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line);counter-reset:o}
.olist:empty::before{content:"Tippe die Schritte unten in der richtigen Reihenfolge an";color:var(--muted);font-size:14px;margin:auto;text-align:center}
.oitem{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:0;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line-dk);font:600 15px var(--body);color:var(--ink);cursor:pointer;counter-increment:o}
.oitem::before{content:counter(o);width:26px;height:26px;border-radius:9px;background:var(--magenta);color:#fff;display:grid;place-items:center;font:800 13px var(--display);flex:none}
.olist.r .oitem{box-shadow:inset 0 0 0 2px var(--ok)}.olist.w .oitem{box-shadow:inset 0 0 0 2px var(--bad)}
.obank{display:flex;flex-direction:column;gap:8px}
.obank .chipbtn{text-align:left;font-weight:600}
.hint{font-size:14px;color:var(--muted);text-align:center;font-weight:600}

.foot{position:sticky;bottom:0;z-index:3;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .lw{padding-block:14px 16px;display:flex;flex-direction:column;gap:10px}
.foot.ok,.foot.bad{border-top:0;animation:slideup .3s cubic-bezier(.2,1.2,.4,1)}
.foot.ok{background:var(--ok-soft)}
.foot.bad{background:var(--bad-soft)}
@keyframes slideup{from{transform:translateY(100%)}}
.tsays{display:flex;align-items:flex-end;gap:10px}
.tsays .mo{width:76px;height:auto;margin-bottom:-4px}
.tb{position:relative;flex:1;min-width:0;background:var(--surface);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:15px;line-height:1.45;box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 8%,transparent)}
.tb b{display:block;font:800 12px var(--body);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.foot.ok .tb b{color:var(--ok)}.foot.bad .tb b{color:var(--bad)}
.fbtitle{font:800 24px var(--display)}
.foot.ok .fbtitle{color:var(--ok)}.foot.bad .fbtitle{color:var(--bad)}
.fbtext{font-size:15px}
.foot.bad .fbtext b{color:var(--bad)}
.fbnote{font-size:13px;color:var(--muted);font-weight:600}

/* Abschluss */
.center2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding-block:36px}
.center2 h1{font-size:clamp(32px,8vw,46px)}
.center2 .btn{max-width:440px}
.center2>.mo{width:150px;height:auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:440px}
.st{border-radius:20px;overflow:hidden;background:var(--c);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#000);color:#fff;padding:4px}
.st small{display:block;font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:6px 4px 4px}
.st b{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);color:var(--c);border-radius:16px;font:800 24px var(--display);padding:12px 4px;font-variant-numeric:tabular-nums}
.st b .ico{width:22px;height:22px}
.newtier{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:16px;background:var(--magenta-soft);color:var(--magenta);font-weight:800}
.newtier.chapter{background:var(--ch-soft);color:var(--ch)}
.score{font:800 64px var(--display);color:var(--ch,var(--magenta));font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:24px;color:var(--muted)}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(18,8,28,.55);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet .lw{width:100%}
.sheetbox{background:var(--surface);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:slideup .3s cubic-bezier(.2,1.2,.4,1)}
.sheetbox h2{font-size:24px}
.sheetbox .mo{width:90px;height:auto}

/* UX-Überarbeitung */
.unit.closed .unithead{box-shadow:0 4px 0 color-mix(in srgb,var(--ch) 60%,#000)}
.unit.locked.closed .unithead{box-shadow:0 4px 0 var(--line-dk)}
.ubar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 6px 0}
.umedals{display:flex;gap:6px;align-items:center}
.umedals .medal{width:28px;height:28px;box-shadow:inset 0 -3px 0 var(--d)}
.umedals .medal.off,.mrow .medal.off{--c:var(--line);--d:var(--line-dk);background:var(--line)}
.umedals .tro{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--line);color:var(--line-dk)}
.umedals .tro.on{background:var(--ch);color:var(--on-ch)}
.umedals .tro .ico{width:17px;height:17px}
.tog{color:var(--ch);text-decoration:none;font-weight:800}
.tog:hover{text-decoration:underline}
.lvcard .statrow .medal{width:52px;height:52px}
.lvcard small{display:block;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.lvbar{display:flex;align-items:center;gap:10px;margin-top:14px;font:700 12px var(--body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lvbar i{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.lvbar i b{display:block;height:100%;border-radius:99px;background:var(--hero)}
@media(min-width:1040px){.teaser.inline{display:none}}
.fbtitle{display:flex;align-items:center;gap:10px}
.fbic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.fbic svg{width:18px;height:18px}
.hint b{color:var(--ink)}
.mo.head{display:block}
@media(max-width:520px){
  .mailtools,.folders,.lictable,.cp-hello,.fr-rail,.cp-input,.sec-head{display:none}
  .ltag{font-size:11px}
}

/* Prüfmodus & Katalog */
.qabar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:linear-gradient(110deg,#2A1A40,#5A1A55);color:#fff;font-size:14px}
.qabar>span{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.qabar>span svg{width:20px;height:20px}
.qabar div{flex:1;min-width:0;line-height:1.35}.qabar b{display:block;font:800 15px var(--display)}
.qabar .btn{min-height:40px}
.qacard .qarow{display:flex;align-items:center;gap:16px}.qacard .qarow div{flex:1;min-width:0}.qacard p{font-size:14px;margin-top:4px}
.switch{position:relative;width:56px;height:32px;border-radius:99px;border:0;background:var(--line-dk);cursor:pointer;flex:none;transition:background .2s}
.switch span{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--magenta)}.switch[aria-checked="true"] span{transform:translateX(24px)}
.qstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qstats .sbox{padding:12px 14px}
.qtools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qfilter{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface);box-shadow:0 2px 0 var(--line)}
.qfilter button{border:0;background:none;padding:8px 12px;border-radius:10px;font:700 14px var(--body);color:var(--muted);cursor:pointer}
.qfilter button.on{background:var(--magenta-soft);color:var(--magenta)}
.qdone{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:14px}
.qdone svg{width:18px;height:18px;flex:none}
.qchap{display:flex;flex-direction:column;gap:14px}
.qchap h2{display:flex;align-items:center;gap:10px;font-size:20px}
.qchap h2 .uico{width:38px;height:38px;border-radius:12px;background:var(--ch-soft);color:var(--ch)}

.cloudstat{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font:700 12px var(--body);color:var(--muted)}
.cloudstat .ico{width:16px;height:16px}
.cloudstat.synced{color:var(--ok)}
.cloudstat.saving{color:var(--violet)}
.cloudstat.readonly,.cloudstat.error{color:var(--fire)}
.wcta .cloudstat{justify-content:center;margin-top:0}

/* Sicherung */
.bkcard{display:flex;flex-direction:column;gap:10px}
.bkcard p{font-size:14px}
.bkrow{display:flex;gap:10px;flex-wrap:wrap}
.bkrow .btn .ico{width:18px;height:18px}
.bkconfirm{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line)}
.bkerr{padding:10px 14px;border-radius:14px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:14px}

/* Namenseingabe */
.wcta{display:flex;flex-direction:column;gap:10px;max-width:460px;margin:0}
.wlabel{font:800 15px var(--body)}
.wrow{display:flex;gap:10px;align-items:stretch}

.wrow input::placeholder{color:var(--muted);font-weight:500}
.wrow input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--magenta),0 4px 0 var(--magenta-soft)}
.wrow input[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--bad),0 4px 0 var(--bad-soft)}
.wrow .btn{width:auto;flex:none;padding:12px 22px}
.werr{color:var(--bad);font-weight:700;font-size:14px}
.wcta small{text-align:left}
@media(max-width:420px){.wrow{flex-direction:column}.wrow input{flex:none;width:100%}.wrow .btn{width:100%}}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

.pop{animation:pop .32s cubic-bezier(.2,1.3,.4,1)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function muteNear(svg,ms){

function tSay(svg,text,ms){
  const r=svg.getBoundingClientRect();if(r.width<20)return;
  document.querySelectorAll('.t-say').forEach(x=>x.remove());
  const b=document.createElement('div');b.className='t-say'+(text.length>40?' long':'');b.textContent=text;b.style.animationDuration=ms+'ms';
  document.body.appendChild(b);
  const bw=b.offsetWidth,x=Math.min(Math.max(8,r.left+r.width/2-bw/2),innerWidth-bw-8),y=Math.max(8,r.top-b.offsetHeight-8);
  b.style.left=x+'px';b.style.top=y+'px';setTimeout(()=>b.remove(),ms);
  muteNear(svg,ms+150);
}
function tPlay(svg,silent){
  if(!svg||svg.dataset.busy)return;
  const pool=T_MOVES.map((m,k)=>k).filter(k=>!(svg.classList.contains('up')&&T_MOVES[k].c==='t-hello'));
  let i;do{i=pool[Math.floor(Math.random()*pool.length)];}while(i===tLast&&pool.length>1);tLast=i;
  const mv=T_MOVES[i];svg.dataset.busy='1';svg.classList.add(mv.c);
  if(!silent)tSay(svg,mv.say[Math.floor(Math.random()*mv.say.length)],1500);
  setTimeout(()=>{svg.classList.remove(mv.c);delete svg.dataset.busy;},1150);
}

/* ---------- Effekte ---------- */
const reduced=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(){
  if(reduced())return;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const ctx=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
  const W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;
  const cols=['#E20074','#6D4DFF','#FFB400','#18B4E8','#14A35A','#FF6A13'];
  const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16*dpr,vy:(-Math.random()*16-6)*dpr,s:(6+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.45*dpr;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-t/120);ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);ctx.restore();});
    if(t<120)requestAnimationFrame(f);else c.remove();})();
}
function countUp(el,to,suffix=''){
  if(!el)return;if(reduced()){el.textContent=to+suffix;return;}
  const t0=performance.now(),d=700;(function f(t){const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-k,3)))+suffix;if(k<1)requestAnimationFrame(f);})(t0);
}

const CLOUD={db:null,uid:null,ready:false,state:'local',timers:{},busy:{},again:{}};
const CLOUD_TXT={local:'Nur auf diesem Gerät gespeichert',saving:'Wird gespeichert …',synced:'In deinem Konto gespeichert',readonly:'Nur auf diesem Gerät, im Konto fehlt die Schreibberechtigung',error:'Speichern im Konto gerade nicht möglich'};
function cloudStatHTML(){return `<span class="cloudstat ${CLOUD.state}" role="status">${I.cloud}<span>${CLOUD_TXT[CLOUD.state]}</span></span>`;}
function cloudUI(){document.querySelectorAll('.cloudstat').forEach(el=>{el.className='cloudstat '+CLOUD.state;el.lastElementChild.textContent=CLOUD_TXT[CLOUD.state];});}
function normS(o){const s=Object.assign(fresh(),o||{});s.prog=Object.assign(fresh().prog,(o&&o.prog)||{});s.days=Array.isArray(s.days)?s.days:[];s.mist=s.mist||{};Object.keys(s.mist).forEach(k=>{if(!EX[k])delete s.mist[k];});return s;}
function cloudDoc(name){return CLOUD.db.collection('data/users/'+CLOUD.uid).doc(name);}
function cloudBody(name){return name==='progress'?{s:JSON.stringify(S),t:S.t||0}:{rev:JSON.stringify(QA.rev||{}),t:QA.t||0};}
function cloudPush(name){if(!CLOUD.ready)return;clearTimeout(CLOUD.timers[name]);CLOUD.timers[name]=setTimeout(()=>cloudFlush(name),800);}
async function cloudFlush(name,retry){
  if(!CLOUD.ready)return;
  if(CLOUD.busy[name]){CLOUD.again[name]=true;return;}
  CLOUD.busy[name]=true;CLOUD.state='saving';cloudUI();
  try{await cloudDoc(name).set(cloudBody(name));CLOUD.state='synced';}
  catch(e){const c=e&&e.code;
    if(c==='invalid_argument'){CLOUD.state='readonly';CLOUD.ready=false;}
    else if(c==='unavailable'&&!retry){CLOUD.busy[name]=false;setTimeout(()=>cloudFlush(name,true),600+Math.random()*900);return;}
    else{CLOUD.state='error';if(c==='revoked'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed')CLOUD.ready=false;}}
  finally{CLOUD.busy[name]=false;}
  cloudUI();
  if(CLOUD.again[name]){CLOUD.again[name]=false;cloudFlush(name);}
}
function rerenderIfIdle(){
  if(app.querySelector('.welcome'))welcome();
  else if(app.querySelector('.shell')){const y=scrollY;home();scrollTo(0,y);}
}
async function cloudPull(){
  let changed=false;
  try{
    const ps=await cloudDoc('progress').get();
    if(ps.exists){const d=ps.data()||{};let c=null;try{c=JSON.parse(d.s);}catch(e){}
      if(c&&(c.t||0)>(S.t||0)){
        try{localStorage.setItem(KEY,JSON.stringify(c));}catch(e){}
        if(!QA.on){S=normS(c);changed=true;}
      }else if((S.t||0)>(c&&c.t||0))cloudPush('progress');
    }else if(S.started||S.xp||lessonsDone())cloudPush('progress');
    const qs=await cloudDoc('qa').get();
    if(qs.exists){const d=qs.data()||{};
      if((d.t||0)>(QA.t||0)){try{QA.rev=JSON.parse(d.rev)||{};QA.t=d.t;localStorage.setItem(QKEY,JSON.stringify(QA));changed=true;}catch(e){}}
      else if((QA.t||0)>(d.t||0))cloudPush('qa');
    }else if(Object.keys(QA.rev||{}).length)cloudPush('qa');
    if(CLOUD.state!=='saving')CLOUD.state='synced';
  }catch(e){CLOUD.state=e&&e.code==='revoked'?'local':'error';}
  cloudUI();
  if(changed)rerenderIfIdle();
}
async function cloudInit(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [user,db]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(!user||!db)return;
    const uid=await user.id();
    if(!uid)return;
    CLOUD.db=db;CLOUD.uid=uid;CLOUD.ready=true;
    await cloudPull();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CLOUD.ready&&!app.querySelector('.lesson'))cloudPull();});
  }catch(e){CLOUD.state='local';cloudUI();}
}

function heroLines(){

  a.push(dx>=GOAL?'Tagesziel geschafft. Stark!':`Noch ${GOAL-dx} XP bis zum Tagesziel.`);
  if(st>1)a.push(`${st} Tage in Folge. Weiter so!`);
  if(mk)a.push(`${mk} ${mk===1?'Fehler wartet':'Fehler warten'} im Fehlertraining.`);
  a.push('Fünf Minuten reichen schon.','Jede Lektion macht dich im Kundengespräch sicherer.','Ich glaub an dich!');
  const out=[a[0]],rest=a.slice(1);
  rest.forEach((x,k)=>{out.push(x);if(k%2===1)out.push('Wusstest du? '+randomFact());});
  return out;

function startHeroTalk(){
  const el=$('hsay');if(!el)return;
  const lines=heroLines();let k=0;
  const fig=el.parentNode.querySelector('svg.mo');
  if(reduced())return;
  const step=()=>{
    el.classList.add('gone');
    cheerTimer=setTimeout(()=>{
      k=(k+1)%lines.length;el.textContent=lines[k];el.classList.remove('gone');
      if(fig)tPlay(fig,true);
      cheerTimer=setTimeout(step,4200+Math.random()*1500);
    },1600+Math.random()*1800);
  };
  cheerTimer=setTimeout(step,4500);
}

function backupHTML(){
  return `<div class="card bkcard"><h3>Spielstand auf diesem Gerät</h3>
    <p class="muted">Dein Fortschritt liegt nur in diesem Browser. Sichere ihn als Datei auf deinem Rechner, dann kannst du ihn jederzeit wiederherstellen oder in einen anderen Browser mitnehmen.</p>

    <div id="bkMsg" role="status"></div></div>`;

function bindBackup(){
  const sv=$('bkSave'),fi=$('bkFile'),msg=$('bkMsg');if(!sv)return;
  sv.onclick=()=>{
    const data={app:'magentalingo',v:1,exported:new Date().toISOString(),state:S,qa:{rev:QA.rev||{}}};
    const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`magentalingo-spielstand-${today()}.json`;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
    msg.innerHTML=`<p class="qdone">${I.check}Spielstand gesichert. Die Datei liegt in deinem Download-Ordner.</p>`;
  };
  fi.onchange=()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{let d=null;try{d=JSON.parse(r.result);}catch(e){}

        const was=QA.on;QA.on=false;save();QA.on=was;home();

/* ---------- Lektion & Test ---------- */
let L=null;
function startLesson(ci,li){
  const ex=CATS[ci].lessons[li].ex;
  L={mode:'lesson',ci,li,ti:Math.floor(li/LPT),ex,queue:shuffle(range(ex.length)),total:ex.length,done:0,hearts:5,wrong:new Set(),quit:false,combo:0};
  nextEx();
}
function startTest(ci){
  const c=CATS[ci],pool=t=>shuffle(c.lessons.slice(t*LPT,t*LPT+LPT).flatMap(l=>l.ex)),take=[3,4,3];
  const ex=shuffle(TIER.flatMap((_,t)=>pool(t).slice(0,take[t])));
  L={mode:'test',ci,ex,queue:range(ex.length),total:ex.length,done:0,right:0,hearts:null,wrong:new Set(),quit:false,combo:0};
  nextEx();
}
function initSt(e){
  if(e.t==='mc')return{sel:null,ord:shuffle(range(e.o.length))};
  if(e.t==='tf')return{sel:null,ord:[0,1]};
  if(e.t==='match')return{L:shuffle(range(e.p.length)),R:shuffle(range(e.p.length)),sl:null,sr:null,done:new Set(),miss:0,flash:null};
  if(e.t==='gap')return{bo:shuffle(range(e.b.length)),fill:e.a.map(()=>null)};
  if(e.t==='order')return{bo:shuffle(range(e.o.length)),pick:[]};
}
function nextEx(){
  if(L.mode==='lesson'&&L.hearts<=0)return fail();
  if(!L.queue.length)return L.mode==='test'?testResult():L.mode==='review'?reviewResult():finish();
  L.cur=L.queue.shift();L.st=initSt(L.ex[L.cur]);L.phase='answer';L.anim=true;drawLesson();
}
const opts=e=>e.t==='tf'?['Stimmt','Stimmt nicht']:e.o;
const ansIdx=e=>e.t==='tf'?(e.a?0:1):e.a;
const INSTR={mc:'Wähle die richtige Antwort.',tf:'Stimmt das?',match:'Tippe an, was zusammengehört.',gap:'Fülle die Lücken.',order:'Tippe die Schritte in der richtigen Reihenfolge an.'};
function ready(e,s){
  if(e.t==='mc'||e.t==='tf')return s.sel!==null;
  if(e.t==='gap')return s.fill.every(v=>v!==null);
  if(e.t==='order')return s.pick.length===e.o.length;
  return false;
}
function isRight(e,s){
  if(e.t==='mc'||e.t==='tf')return s.sel===ansIdx(e);
  if(e.t==='gap')return s.fill.every((v,k)=>e.b[v]===e.a[k]);
  if(e.t==='order')return s.pick.every((v,k)=>v===k);
  if(e.t==='match')return s.miss===0;
}
function solution(e){
  if(e.t==='mc'||e.t==='tf')return opts(e)[ansIdx(e)];
  if(e.t==='gap'){let k=0;return e.s.replace(/\{\d\}/g,()=>e.a[k++]);}
  if(e.t==='order')return e.o.join(' → ');
  if(e.t==='match')return e.p.map(p=>p[0]+': '+p[1]).join(' · ');
}
function exBody(e,s,fb){
  if(e.t==='mc'||e.t==='tf'){const a=ansIdx(e),O=opts(e);
    const btn=(i,k)=>{let c='';if(fb){if(i===a)c=' right';else if(i===s.sel)c=' wrong';}else if(s.sel===i)c=' sel';
      return `<button class="opt${c}" data-i="${i}" ${fb?'disabled':''}>${e.t==='mc'?`<span class="k">${k+1}</span>`:''}${esc(O[i])}</button>`;};
    return `<div class="${e.t==='tf'?'tfrow':'opts'}">${s.ord.map(btn).join('')}</div>`;}
  if(e.t==='match'){const tile=(side,i)=>{const txt=e.p[i][side==='L'?0:1];const d=s.done.has(i);const sel=(side==='L'?s.sl:s.sr)===i;const fl=s.flash&&s.flash[side==='L'?0:1]===i;
      return `<button class="tile${d?' done':fl?' flash':sel?' sel':''}" data-s="${side}" data-i="${i}" ${d||fb?'disabled':''}>${esc(txt)}</button>`;};
    return `<div class="match"><div class="mcol">${s.L.map(i=>tile('L',i)).join('')}</div><div class="mcol">${s.R.map(i=>tile('R',i)).join('')}</div></div>`;}
  if(e.t==='gap'){const parts=e.s.split(/\{(\d)\}/);let h='';parts.forEach((p,k)=>{if(k%2===0)h+=esc(p);else{const n=+p,v=s.fill[n];let c=v!==null?' filled':'';if(fb&&v!==null)c+=e.b[v]===e.a[n]?' r':' w';
      h+=`<button class="slot${c}" data-n="${n}" ${fb?'disabled':''} aria-label="Lücke ${n+1}">${v!==null?esc(e.b[v]):''}</button>`;}});
    const used=new Set(s.fill.filter(v=>v!==null));
    return `<div class="sentence">${h}</div><div class="bank">${s.bo.map(i=>`<button class="chipbtn${used.has(i)?' used':''}" data-b="${i}" ${used.has(i)||fb?'disabled':''}>${esc(e.b[i])}</button>`).join('')}</div>`;}
  if(e.t==='order'){const cls=fb?(isRight(e,s)?' r':' w'):'';
    return `<div class="olist${cls}">${s.pick.map((i,k)=>`<button class="oitem" data-k="${k}" ${fb?'disabled':''}>${esc(e.o[i])}</button>`).join('')}</div>
      <div class="obank">${s.bo.filter(i=>!s.pick.includes(i)).map(i=>`<button class="chipbtn" data-b="${i}" ${fb?'disabled':''}>${esc(e.o[i])}</button>`).join('')}</div>`;}
}
const PRAISE=['Richtig!','Sauber!','Genau so!','Stark!','Passt!','Volltreffer!'];
const COMFORT=['Nicht ganz.','Knapp daneben.','Fast.'];
function drawLesson(){
  const e=L.ex[L.cur],s=L.st,fb=L.phase==='fb',rev=L.mode==='review',test=L.mode!=='lesson';
  const ci=rev?e.ci:L.ci,cat=CATS[ci];
  const pct=Math.max(4,L.done/L.total*100);
  const eli=+e.key.split(':')[1],eTier=TIER[Math.floor(eli/LPT)].n;
  const tierName=rev?eTier:test?'Abschlusstest':TIER[L.ti].n;
  const nr=Math.min(L.done+1,L.total);
  const label=rev?`Fehler ${nr} von ${L.total}`:test?`Frage ${nr} von ${L.total}`:`Aufgabe ${nr} von ${L.total}`;
  const tag=(QA.on?'Prüfmodus · ':'')+(rev?`Fehlertraining · ${esc(cat.name)}`:test?`Abschlusstest · ${esc(cat.name)}`:`${esc(cat.lessons[L.li].title)} · ${tierName} ${L.li%LPT+1}`);
  let foot;
  if(!fb){
    foot=e.t==='match'?`<div class="foot"><div class="lw gut"><p class="hint"><b>${s.done.size} von ${e.p.length}</b> Paaren gefunden · tippe links und rechts an, was zusammengehört</p></div></div>`
      :`<div class="foot"><div class="lw gut"><button class="btn" id="chk" ${ready(e,s)?'':'disabled'}>Prüfen</button></div></div>`;
  }else{
    const ok=L.ok;
    const title=ok?(L.combo>=3?`${L.combo} in Folge!`:PRAISE[L.cur%PRAISE.length]):COMFORT[L.cur%COMFORT.length];
    foot=`<div class="foot ${ok?'ok':'bad'}" role="status" aria-live="polite"><div class="lw gut">
      <div class="fbtitle"><span class="fbic">${ok?I.check:I.x}</span>${title}</div>
      ${!ok?`<p class="fbtext"><b>Lösung:</b> ${esc(solution(e))}</p>`:''}
      ${e.x?`<div class="tsays">${mascot(ok?(L.combo>=3?'cheer':'happy'):'think')}<div class="tb"><b>${ok?'Tilly erklärt':'Tilly hilft weiter'}</b>${esc(e.x)}</div></div>`:''}
      ${!ok?`<p class="fbnote">${rev?'Bleibt im Fehlertraining.':test?'Landet im Fehlertraining.':'Kommt am Ende der Lektion noch einmal und landet im Fehlertraining.'}</p>`:''}
      ${ok&&rev?`<p class="fbnote">Raus aus dem Fehlertraining.</p>`:''}
      <button class="btn ${ok?'ok':'bad'}" id="nx">Weiter</button></div></div>`;
  }
  const secPct=Math.round(45+(L.done/L.total)*55);
  go(`<div class="lesson ch-${cat.id}${test?' test':''}">${blobs}${bg(cat.id)}
    <div class="lw gut lhead"><button class="iconbtn" id="q" aria-label="Beenden">${I.x}</button><div class="bar" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="${L.total}" aria-valuenow="${L.done}"><i style="width:${pct}%"></i></div>
      ${L.combo>=2?`<span class="pillstat combo" title="Richtig in Folge">${I.flame}${L.combo}</span>`:''}
      ${test?`<span class="pillstat">${nr}/${L.total}</span>`:`<span class="pillstat heart" title="Herzen">${I.heart}${L.hearts}</span>`}</div>
    <div class="lw gut lmain${L.anim?' pop':''}"><div class="ltag"><i></i>${tag}</div>
      ${frame(cat,{prompt:esc(e.q),instr:INSTR[e.t],inner:exBody(e,s,fb),label,tier:tierName,pct:secPct})}</div>
    ${foot}
    ${L.quit?`<div class="sheet"><div class="lw"><div class="sheetbox">${mascot('sad')}<h2>${rev?'Fehlertraining':test?'Test':'Lektion'} wirklich beenden?</h2><p class="muted">Dein Fortschritt in dieser Runde geht verloren.</p>
      <button class="btn" id="stay">Weitermachen</button><button class="btn ghost" id="leave">Beenden</button></div></div></div>`:''}
  </div>`);
  L.anim=false;
  const redraw=()=>{const y=window.scrollY;drawLesson();window.scrollTo(0,y);};
  $('q').onclick=()=>{L.quit=true;redraw();};
  if(L.quit){$('stay').onclick=()=>{L.quit=false;redraw();};$('leave').onclick=()=>{L=null;home(true);};onKey=null;return;}
  if(fb){$('nx').onclick=nextEx;onKey=ev=>{if(ev.key==='Enter'){ev.preventDefault();nextEx();}};return;}
  const chk=()=>{L.ok=isRight(e,s);L.phase='fb';
    if(!L.ok){addMist(e);L.combo=0;}else{L.combo++;S.best=Math.max(S.best||0,L.combo);if(rev)delete S.mist[e.key];}
    if(test){L.done++;if(L.ok)L.right++;else L.wrong.add(L.cur);}
    else if(L.ok)L.done++;else{L.hearts--;L.wrong.add(L.cur);L.queue.push(L.cur);}
    save();redraw();};
  if($('chk'))$('chk').onclick=chk;
  onKey=ev=>{if((e.t==='mc'||e.t==='tf')){const k=+ev.key;if(k>=1&&k<=s.ord.length){s.sel=s.ord[k-1];redraw();}}
    if(ev.key==='Enter'&&ready(e,s)){ev.preventDefault();chk();}};
  if(e.t==='mc'||e.t==='tf')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{s.sel=+b.dataset.i;redraw();});
  if(e.t==='gap'){
    app.querySelectorAll('.bank .chipbtn').forEach(b=>b.onclick=()=>{const k=s.fill.indexOf(null);if(k>-1){s.fill[k]=+b.dataset.b;redraw();}});
    app.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{s.fill[+b.dataset.n]=null;redraw();});
  }
  if(e.t==='order'){
    app.querySelectorAll('.obank .chipbtn').forEach(b=>b.onclick=()=>{s.pick.push(+b.dataset.b);redraw();});
    app.querySelectorAll('.oitem').forEach(b=>b.onclick=()=>{s.pick.splice(+b.dataset.k,1);redraw();});
  }
  if(e.t==='match'){
    app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
      if(s.flash)return;
      const i=+b.dataset.i;if(b.dataset.s==='L')s.sl=i;else s.sr=i;
      if(s.sl!==null&&s.sr!==null){
        if(s.sl===s.sr){s.done.add(s.sl);s.sl=s.sr=null;if(s.done.size===e.p.length){chk();return;}}
        else{s.miss++;s.flash=[s.sl,s.sr];s.sl=s.sr=null;setTimeout(()=>{if(L&&L.st===s){s.flash=null;redraw();}},450);}
      }
      redraw();
    });
  }
}

  $('h').onclick=toPath;
  onKey=ev=>{if(ev.key==='Enter'){ev.preventDefault();nxt?startItem(nxt):toPath();}};

const tiles=third=>`<div class="tiles">
  <div class="st" style="--c:var(--sun)"><small>XP</small><b>${I.bolt}<span id="cx">0</span></b></div>
  <div class="st" style="--c:var(--ok)"><small>Treffer</small><b><span id="ca">0</span></b></div>
  ${third}</div>`;
function goalLine(){return dailyXP()>=GOAL?`<p class="newtier" style="background:var(--violet-soft);color:var(--violet)">Tagesziel geschafft: ${dailyXP()} von ${GOAL} XP</p>`:`<p class="muted" style="font-size:14px;font-weight:600">Tagesziel: ${dailyXP()} von ${GOAL} XP</p>`;}
function finish(){
  const c=CATS[L.ci],acc=Math.round((L.total-L.wrong.size)/L.total*100);
  const xp=10+[5,10,15][L.ti]+(L.wrong.size===0?5:0);
  const advanced=S.prog[c.id]===L.li;
  if(advanced)S.prog[c.id]=L.li+1;
  const tierDone=advanced&&(L.li+1)%LPT===0;
  addXP(xp);bumpStreak();save();
  const t=TIER[L.ti],nxt=nextItem(L.ci);
  go(`<div class="lesson ch-${c.id}">${blobs}${bg(c.id)}<div class="lw gut center2">
    ${mascot('cheer','float')}
    <h1>Lektion geschafft!</h1>
    <p class="muted" style="font-weight:600">${esc(c.lessons[L.li].title)} · ${esc(c.name)}</p>
    ${tierDone?`<div class="newtier">Neue Medaille: ${t.n} in ${esc(c.name)}</div>`:''}
    ${advanced&&S.prog[c.id]===NL?`<div class="newtier chapter">Der Abschlusstest für dieses Kapitel ist jetzt offen.</div>`:''}
    ${tiles(`<div class="st" style="--c:var(--bad)"><small>Herzen</small><b>${I.heart}${L.hearts}</b></div>`)}
    <p class="muted" style="font-size:14px;font-weight:600">${L.wrong.size===0?'Fehlerfrei, dafür gibt es 5 XP extra.':`${L.wrong.size} ${L.wrong.size===1?'Aufgabe liegt':'Aufgaben liegen'} jetzt im Fehlertraining.`}</p>
    ${goalLine()}
    ${endButtons(nxt)}
  </div></div>`);
  countUp($('cx'),xp);countUp($('ca'),acc,' %');confetti();
  bindEnd(nxt);
}
function testResult(){
  const c=CATS[L.ci],need=Math.ceil(L.total*0.8),passed=L.right>=need,first=passed&&!S.test[c.id];
  const xp=passed?(first?50:15):5;
  if(passed)S.test[c.id]=true;
  addXP(xp);bumpStreak();save();
  const nxt=passed?nextItem(L.ci):null,ci=L.ci;
  go(`<div class="lesson ch-${c.id} test">${blobs}${bg(c.id)}<div class="lw gut center2">
    ${mascot(passed?'cheer':'sad','float')}
    <h1>${passed?'Kapitel abgeschlossen!':'Noch nicht bestanden'}</h1>
    <p class="muted" style="font-weight:600">Abschlusstest · ${esc(c.name)}</p>
    <div class="score">${L.right}<small> / ${L.total}</small></div>
    ${first?`<div class="newtier chapter">${I.trophy} Neue Trophäe${ci<CATS.length-1?` · Kapitel ${ci+2} ist offen`:''}</div>`:''}
    ${passed&&!first?'<p class="muted">Wieder bestanden. Gute Wiederholung.</p>':''}
    ${!passed?`<p class="muted" style="max-width:42ch">Zum Bestehen brauchst du ${need} richtige Antworten. Deine Fehler liegen im Fehlertraining.</p>`:''}
    ${tiles(`<div class="st" style="--c:var(--ch)"><small>Nötig</small><b>${need}</b></div>`)}
    ${goalLine()}
    ${passed?endButtons(nxt):`<button class="btn" id="r">Test wiederholen</button><button class="btn ghost" id="fx">Fehler üben</button><button class="btn ghost" id="h">Zum Lernpfad</button>`}
  </div></div>`);
  countUp($('cx'),xp);countUp($('ca'),Math.round(L.right/L.total*100),' %');
  if(passed){confetti();bindEnd(nxt);}
  else{$('r').onclick=()=>startTest(ci);$('fx').onclick=startReview;$('h').onclick=toPath;onKey=null;}
}
function reviewResult(){
  const left=mistKeys().length,xp=L.right*2;
  addXP(xp);bumpStreak();save();
  const nxt=nextItem(0),all=L.right===L.total;
  go(`<div class="lesson">${blobs}<div class="lw gut center2">
    ${mascot(all?'cheer':'happy','float')}
    <h1>${all?'Alle Fehler ausgebügelt!':'Runde geschafft'}</h1>
    <div class="score" style="color:var(--magenta)">${L.right}<small> / ${L.total}</small></div>
    <p class="muted" style="max-width:42ch">${L.right} ${L.right===1?'Aufgabe ist':'Aufgaben sind'} raus aus dem Fehlertraining. ${left?`Noch ${left} übrig.`:'Die Liste ist leer.'}</p>
    ${tiles(`<div class="st" style="--c:var(--magenta)"><small>Offen</small><b>${left}</b></div>`)}
    ${goalLine()}
    ${left?`<button class="btn" id="again">Weiter üben</button>`:''}
    ${nxt?`<button class="btn${left?' ghost':''}" id="nn">Weiter: ${esc(itemName(nxt))}</button>`:''}
    <button class="btn ghost" id="h">Zum Lernpfad</button>
  </div></div>`);
  countUp($('cx'),xp);countUp($('ca'),Math.round(L.right/L.total*100),' %');
  if(all)confetti();
  if($('again'))$('again').onclick=startReview;
  if($('nn'))$('nn').onclick=()=>startItem(nxt);
  $('h').onclick=toPath;
  onKey=ev=>{if(ev.key==='Enter'){ev.preventDefault();left?startReview():toPath();}};
}
function fail(){
  const ci=L.ci,li=L.li,c=CATS[ci];
  onKey=null;
  go(`<div class="lesson ch-${c.id}">${blobs}${bg(c.id)}<div class="lw gut center2">
    ${mascot('sad','float')}
    <h1>Keine Herzen mehr</h1>
    <p class="muted" style="max-width:40ch">Kein Drama. Die Lösungen hast du jetzt gesehen, und deine Fehler liegen im Fehlertraining. Beim zweiten Versuch sitzt es meist.</p>
    <button class="btn" id="r">Noch mal versuchen</button>
    <button class="btn ghost" id="h">Zum Lernpfad</button>
  </div></div>`);
  $('r').onclick=()=>startLesson(ci,li);$('h').onclick=toPath;
}

welcome();
cloudInit();

</script>
</body>
</html>
